apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: visiospark }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: ghcr.io/YOUR_GITHUB_USER/visiospark-backend:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: visiospark-secrets, key: DB_PASSWORD } }
            - name: ADMIN_KEY
              valueFrom: { secretKeyRef: { name: visiospark-secrets, key: ADMIN_KEY } }
            - name: DATABASE_URL
              value: postgres://visiospark:$(DB_PASSWORD)@postgres:5432/visiospark
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: visiospark }
spec:
  selector: { app: backend }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend, namespace: visiospark }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
